<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIA - By BEN - 5 Langues</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
h2{text-align:center;color:#6a11cb}
#chat{background:white;height:320px;overflow:auto;padding:10px;border-radius:15px}
.mia{background:#e9e0ff;padding:8px;border-radius:10px;margin:5px}
.moi{background:#d1ffdb;padding:8px;border-radius:10px;margin:5px;text-align:right}
#box{display:flex;margin-top:10px}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc}
button{padding:12px 15px;border:none;background:#6a11cb;color:white;border-radius:20px;margin-left:5px}
.lang{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.lang button{background:#ff6b00}
</style>
</head>
<body>
<h2>Bonjour, je suis MIA 🤖</h2>
<p style="text-align:center">Créée par BEN - Je parle 5 langues !<br>🇫🇷 Français • 🇬🇧 Anglais • 🇹🇿 Swahili • 🇪🇸 Espagnol • 🇨🇩 Lingala</p>
<div class="lang">
<button onclick="mot('bonjour')">Bonjour</button>
<button onclick="mot('merci')">Merci</button>
<button onclick="mot('amour')">Amour</button>
<button onclick="mot('famille')">Famille</button>
<button onclick="mot('paix')">Paix</button>
<button onclick="mot('ami')">Ami</button>
<button onclick="mot('eau')">Eau</button>
<button onclick="mot('maison')">Maison</button>
<button onclick="mot('dieu')">Dieu</button>
<button onclick="mot('joie')">Joie</button>
</div>
<div id="chat"><div class="mia"><b>MIA :</b> Bonjour Chef ! Appuie sur un mot, je te le traduis en 5 langues !</div></div>
<div id="box"><input id="msg" placeholder="Écris un mot... ex: amour"><button onclick="parler()">Envoyer</button></div>
<script>
let mots={
"bonjour":{fr:"Bonjour",en:"Hello",sw:"Jambo",es:"Hola",li:"Mbote"},
"merci":{fr:"Merci",en:"Thank you",sw:"Asante",es:"Gracias",li:"Matondo"},
"amour":{fr:"Amour",en:"Love",sw:"Upendo",es:"Amor",li:"Bolingo"},
"famille":{fr:"Famille",en:"Family",sw:"Familia",es:"Familia",li:"Libota"},
"paix":{fr:"Paix",en:"Peace",sw:"Amani",es:"Paz",li:"Kimia"},
"ami":{fr:"Ami",en:"Friend",sw:"Rafiki",es:"Amigo",li:"Moninga"},
"eau":{fr:"Eau",en:"Water",sw:"Maji",es:"Agua",li:"Mai"},
"maison":{fr:"Maison",en:"House",sw:"Nyumba",es:"Casa",li:"Ndako"},
"dieu":{fr:"Dieu",en:"God",sw:"Mungu",es:"Dios",li:"Nzambe"},
"joie":{fr:"Joie",en:"Joy",sw:"Furaha",es:"Alegría",li:"Esengo"}
};
function mot(m){
let d=mots[m];
let c=document.getElementById("chat");
c.innerHTML+='<div class="mia"><b>MIA :</b> <b>'+m.toUpperCase()+'</b><br>🇫🇷 Français: '+d.fr+'<br>🇬🇧 Anglais: '+d.en+'<br>🇹🇿 Swahili: '+d.sw+'<br>🇪🇸 Espagnol: '+d.es+'<br>🇨🇩 Lingala: '+d.li+'</div>';
c.scrollTop=c.scrollHeight;
}
function parler(){
let i=document.getElementById("msg");let t=i.value.toLowerCase().trim();if(!t) return;
let c=document.getElementById("chat");
c.innerHTML+='<div class="moi"><b>Toi :</b> '+t+'</div>';i.value="";
if(mots[t]){mot(t);}else{c.innerHTML+='<div class="mia"><b>MIA :</b> Chef, je connais 10 mots : bonjour, merci, amour, famille, paix, ami, eau, maison, dieu, joie. Essaie un !</div>';}
c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
